[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "generationimage"
version = "0.1.0"
description = "Process-prior, scale-adaptive, texture-preserving anomaly generation for printed fabric"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2",
  "Pillow>=10",
  "opencv-python-headless>=4.8",
  "PyWavelets>=1.4",
  "PyYAML>=6",
  "scikit-image>=0.21",
  "tqdm>=4.66",
]

[project.optional-dependencies]
o2mag = [
  "torch==2.1.2",
  "torchvision==0.16.2",
  "diffusers==0.29.2",
  "transformers==4.26.1",
  "accelerate==0.30.1",
  "einops>=0.8",
  "pytorch-lightning>=2.2",
  "matplotlib>=3.8",
]
eval = ["lpips>=0.1.4", "scikit-learn>=1.3"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
fabric-generate = "fabric_o2mag.cli:main"
fabric-evaluate = "fabric_o2mag.evaluate:main"
fabric-split = "fabric_o2mag.split:main"

[tool.setuptools.packages.find]
include = ["fabric_o2mag*", "triag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

