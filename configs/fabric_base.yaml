seed: 2026
model_path: /path/to/stable-diffusion-v1-5
device: cuda:0
steps: 50
guidance_scale: 7.5
prompt:
  normal: a close-up photo of printed textile fabric
  defect: a close-up photo of printed textile fabric with {defect}
  negative: pristine, flawless, clean, uniform printing, no defect
  normal_by_type:
    white_spot: a close-up photo of digitally printed floral textile fabric with a solid black leaf motif
  defect_by_type:
    white_spot: a close-up photo of digitally printed floral textile fabric with a small irregular white missing-ink spot on the black leaf
  negative_by_type:
    white_spot: large white patch, multiple white spots, white object, hole, tear, stain, recolored leaf, distorted floral pattern, damaged fabric weave, blurry texture
  focus_word_by_type:
    white_spot: spot
roi:
  enabled: true
  model_size: 512
  min_defect_px: 24
  context_ratio: 3.0
  min_crop_size: 64
fusion:
  enabled: true
  wavelet: db2
  levels: 2
  feather_radius: 5
  lambda_high:
    stain: 0.95
    ink_smear: 0.75
    white_spot: 0.70
    nozzle_line: 0.85
    banding: 0.90
routes:
  nozzle_line: procedural
  banding: procedural
  white_spot: o2mag
  speckle: procedural
  stain: o2mag
  ink_smear: o2mag
mask_defaults:
  direction: vertical
  width: [1, 4]
  period: [18, 60]
  count: [1, 8]
  radius: [2, 10]
mask_by_type:
  white_spot:
    count: [1, 1]
    radius: [3, 7]
    placement:
      mode: dark_regions
      luminance_max: 90
      min_component_area: 120
      close_kernel: 9
      edge_margin: 3
